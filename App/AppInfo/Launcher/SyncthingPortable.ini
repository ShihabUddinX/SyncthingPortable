[Launch]
ProgramExecutable=Syncthing\Syncthing.exe
ProgramExecutable64=Syncthing\Syncthing64.exe
ProgramExecutableARM64=Syncthing\SyncthingARM64.exe
CommandLineArguments=--home="%PAL:DataDir%\SyncthingAppData" --no-console --no-upgrade
WaitForProgram=false
WaitForOtherInstances=true
HideCommandLineWindow=true
WorkingDirectory=%PAL:DataDir%
SingleAppInstance=false

[FileWrite1]
Type=Replace
File=%PAL:DataDir%\SyncthingAppData\config.xml
Find=%PAL:LastDrive%\
Replace=%PAL:Drive%\

[FileWrite2]
Type=Replace
File=%PAL:DataDir%\SyncthingAppData\config.xml
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir%\
Replace=%PAL:Drive%%PAL:PackagePartialDir%\

[FileWrite3]
Type=Replace
File=%PAL:DataDir%\SyncthingAppData\config.xml
Find=%PAL:LastPortableAppsBaseDir%\
Replace=%PAL:PortableAppsBaseDir%\